name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # The app's own unit tests (lib/**/*.test.ts), run by Node's type stripping like
      # the services' are.
      - run: npm test
      # No Supabase or chain configuration, deliberately. The build has to work without
      # credentials or it cannot be built in CI, and it previously did not.
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 for native type stripping: the services have no build step and Node runs
          # the .ts files directly. It is on by default from 22.18, and pinning the major
          # avoids depending on which 22.x the runner happens to install.
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The independent scorer's fixtures are the engine's own output. Rebuilding them must
      # change nothing, or the engine's results changed and the scorer no longer checks them.
      - name: Engine still matches the scorer fixtures
        run: |
          node ../scorer/tools/make-fixtures.mjs
          git diff --exit-code -- ../scorer/fixtures

  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: nothing to install.
      - run: python3 -m unittest discover -s scorer -v

  agent-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same as services: Node runs the .ts files directly. The tests start the real
          # Arena engine from services/src in-process, which needs only Node built-ins, so
          # services' own dependencies are not installed here.
          node-version: 24
          cache: npm
          cache-dependency-path: packages/agent-sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v4
      # Applied in order against real Postgres with Supabase's default privileges, because
      # a migration that only parses is not a migration that works. This is how the
      # column-level REVOKE that silently did nothing was caught.
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin noinherit;
          create role authenticated nologin noinherit;
          create role service_role nologin noinherit bypassrls;
          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges in schema public grant select on tables to anon, authenticated;
          alter default privileges in schema public grant all on tables to service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          SQL
          for file in supabase/migrations/*.sql; do
            echo "applying $file"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$file"
          done
